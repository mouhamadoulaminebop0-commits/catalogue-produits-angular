<section class="contact">
  <h1>Contactez-nous</h1>
  <p class="subtitle">Une question sur nos produits ? Écrivez-nous !</p>

  @if (messageEnvoye) {
    <div class="success-message">
      Merci {{ nom }} ! Votre message a bien été reçu.
    </div>
  }

  <form (ngSubmit)="envoyerMessage()">
    <div class="form-group">
      <label for="nom">Nom</label>
      <input
        type="text"
        id="nom"
        name="nom"
        [(ngModel)]="nom"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        [(ngModel)]="message"
        required
      ></textarea>
    </div>

    <button type="submit">Envoyer</button>
  </form>
</section>
